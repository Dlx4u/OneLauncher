name: Windows build (development)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/3d6c7698-onelauncher

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up packages
        uses: ./.github/actions/setup-packages
      - name: Build Windows executable and installer
        shell: bash
        run: pnpm --filter @onelauncher/desktop exec tauri build --bundles nsis
      - name: Smoke test launcher startup
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release -File -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Launcher executable not found' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          try {
            Start-Sleep -Seconds 45
            $process.Refresh()
            if ($process.HasExited) { throw "Launcher exited during startup (exit code $($process.ExitCode))" }
            Write-Host 'Launcher process remained running for 45 seconds.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload Windows build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-launcher-windows-development
          path: |
            target/release/*.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
