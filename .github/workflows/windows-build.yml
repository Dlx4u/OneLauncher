name: Windows build (development)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/3d6c7698-onelauncher

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Set up packages
        uses: ./.github/actions/setup-packages
      - name: Build Windows executable and installer
        shell: bash
        run: pnpm --filter @onelauncher/desktop exec tauri build --bundles nsis
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: aurora-launcher-windows-development
          path: |
            target/release/*.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
