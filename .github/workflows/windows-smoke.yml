name: Windows executable smoke test

on:
  push:
    branches:
      - arena/3d6c7698-onelauncher
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Download previously built executable
        uses: actions/download-artifact@v4
        with:
          name: aurora-launcher-windows-development
          path: app
          github-token: ${{ github.token }}
          run-id: 43881092639
      - name: Smoke test executable startup
        shell: pwsh
        run: |
          Get-ChildItem app -Recurse -File | Format-Table FullName,Length
          $exe = Get-ChildItem app -Recurse -File -Filter '*onelauncher*.exe' | Where-Object { $_.FullName -notmatch 'bundle|setup' } | Select-Object -First 1
          if (-not $exe) { throw 'Launcher executable was not found in artifact' }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          try {
            Start-Sleep -Seconds 45
            $process.Refresh()
            if ($process.HasExited) { throw "Launcher exited during startup (exit code $($process.ExitCode))" }
            Write-Host "Launcher process remained running for 45 seconds. PID: $($process.Id)"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
